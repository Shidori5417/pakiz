[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/dissect/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pakiz-dissect = { path = "crates/dissect" }
pakiz-capture = { path = "crates/capture" }
pakiz-tui = { path = "crates/tui" }
pakiz-storage = { path = "crates/storage" }
pakiz-filter = { path = "crates/filter" }
pakiz-flow = { path = "crates/flow" }
pakiz-stats = { path = "crates/stats" }
signal-hook = "0.3"
ratatui = "0.30"
libc = "0.2"
thiserror = "2"
crossbeam-channel = "0.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
